name: 🔧 Build

on:
  push:
    # Every branch builds on push, exactly once per commit. There is deliberately no
    # pull_request trigger: this repo's PRs always come from same-repo branches, so the commit
    # that opened or updated a PR has already fired a push run here. Firing both push and
    # pull_request would build the same commit twice (duplicate Telegram APKs) and the
    # concurrency cancellation below would leave a "cancelled" Build APKs / Send APKs to Telegram
    # context that marks the PR mergeable_state as unstable even when the real run succeeded.
    # Fork PRs are not buildable regardless - GitHub withholds the org secrets from a fork-HEAD
    # run and gives it no runners. Other branches can also be built on demand via workflow_dispatch.
    paths:
      - 'app/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'gradle.properties'
      - 'local.properties'
      - '.github/workflows/build.yml'
      # The AI build-repair pipeline is part of this job, so a change to it must build.
      - '.github/workflows/ai_build_repair.sh'
      - '.github/workflows/ai_commit_repairs.sh'
      - '.github/workflows/ai_repair_guard.sh'
      - '.github/workflows/kilo_repair_config.jsonc'
  workflow_dispatch:

# Concurrency folds overlapping runs on the same branch (rapid pushes) into one, so the newest
# commit wins and the test channel gets a single APK. With no pull_request event, head_ref is
# always empty and the group is just the branch name.
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Least privilege. The workflow itself only needs to read the repository and its own run's
# artifacts; the build job widens this to contents:write because the self-healing loop may
# have to publish exactly one consolidated repair commit.
permissions:
  contents: read
  actions: read

jobs:
  build:
    name: 🔨 Build APKs
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'blacksmith-4vcpu-ubuntu-2404' }}
    # contents:write is used at most once per run, by "Commit AI repairs", and only after the
    # release build and the release verification both passed. Nothing else needs write access.
    permissions:
      contents: write
    outputs:
      short_sha: ${{ steps.set_sha.outputs.short_sha }}
      ai_repairs: ${{ steps.build_loop.outputs.ai_repairs }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6
        with:
          # versionCode is `git rev-list --count HEAD`; a shallow clone would make it 1
          # for every build, so each new APK would install as a downgrade.
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: 🔑 Create google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error title=google-services.json::GOOGLE_SERVICES_JSON is empty"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          # The Gradle google-services plugin rejects malformed JSON; what it cannot catch is a
          # valid file for the wrong project, which is how a deleted Firebase project shipped
          # unnoticed. Pin the project number and both package clients here.
          fail=0
          for pattern in \
            '"project_number"[[:space:]]*:[[:space:]]*"999615440042"' \
            '"package_name"[[:space:]]*:[[:space:]]*"com\.synapse\.social\.studioasinc"' \
            '"package_name"[[:space:]]*:[[:space:]]*"com\.synapse\.social\.studioasinc\.debug"'; do
            if ! grep -Eq "$pattern" app/google-services.json; then
              echo "::error title=google-services.json::pattern not found: $pattern"
              fail=1
            fi
          done
          exit "$fail"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      # Runs the release build. If the first attempt fails with a real code error, the same job,
      # runner and workspace run a bounded diagnose -> repair -> rebuild loop with the Kilo Code
      # CLI before giving up. Gradle caches and the working tree are reused between attempts.
      # See .github/workflows/AI_SELF_HEALING.md.
      - name: 🏗️ Build Release APK (AI self-healing)
        id: build_loop
        timeout-minutes: 240
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_SYNAPSE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SYNAPSE_ANON_KEY }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_URL: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_URL }}
          SUPABASE_SYNAPSE_S3_ENDPOINT_REGION: ${{ secrets.SUPABASE_SYNAPSE_S3_ENDPOINT_REGION }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY_ID }}
          SUPABASE_SYNAPSE_S3_ACCESS_KEY: ${{ secrets.SUPABASE_SYNAPSE_S3_ACCESS_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.jvmargs='-Xmx6g -XX:MaxMetaspaceSize=1g'"
          # Repair agent credentials. Never echoed; removed from the Gradle environment and from
          # the agent's own environment (the loop runs it under `env -i`).
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          # Optional overrides; leave the repository variables unset to use the documented free
          # default (kilo/kilo-auto/free) with automatic fallback.
          AI_REPAIR_MODEL: ${{ vars.KILO_REPAIR_MODEL }}
          AI_REPAIR_FALLBACK_MODELS: ${{ vars.KILO_REPAIR_FALLBACK_MODELS }}
          AI_REPAIR_MAX_BUILD_ATTEMPTS: '5'
          AI_REPAIR_MAX_INFRA_RETRIES: '2'
        run: bash ./.github/workflows/ai_build_repair.sh

      - name: 🔎 Verify shipped auth and push config
        run: |
          set -euo pipefail
          build_config=app/build/generated/source/buildConfig/release/com/synapse/social/studioasinc/BuildConfig.java
          if [ ! -f "$build_config" ]; then
            echo "::error title=BuildConfig::missing $build_config"
            exit 1
          fi
          fail=0
          expect() {
            field=$1
            want=$2
            got=$(grep -oP "(?<=String $field = \")[^\"]*" "$build_config" || true)
            if [ "$got" != "$want" ]; then
              echo "::error title=BuildConfig::$field resolved to '${got}', expected '$want' — check the org secret"
              fail=1
            fi
          }
          expect SUPABASE_URL "https://apqvyyphlrtmuyjnzmuq.supabase.co"
          expect GOOGLE_WEB_CLIENT_ID "999615440042-9s9he8resh1k2i6st0dnmg1fiogv0vm6.apps.googleusercontent.com"
          expect ONESIGNAL_APP_ID "e6b42d8e-8039-4042-9d49-f96a7b675ad3"
          exit "$fail"

      # One commit for every successful repair, and only ever after the build and the
      # verification step above both passed. Skipped entirely when no repair was needed.
      - name: 🧾 Commit AI repairs
        if: steps.build_loop.outputs.repairs_applied == 'true'
        shell: bash
        env:
          AI_REPAIR_APPLIED: ${{ steps.build_loop.outputs.repairs_applied }}
          AI_REPAIR_ATTEMPTS: ${{ steps.build_loop.outputs.build_attempts }}
          AI_REPAIR_MODEL: ${{ steps.build_loop.outputs.kilo_model }}
          AI_REPAIR_REF_TYPE: ${{ github.ref_type }}
          AI_REPAIR_HEAD_REF: ${{ github.head_ref }}
          AI_REPAIR_BRANCH: ${{ github.head_ref || github.ref_name }}
          AI_REPAIR_ACTOR: ${{ github.actor }}
        run: bash ./.github/workflows/ai_commit_repairs.sh

      # Evidence for every attempt: Gradle logs, the exact prompt handed to the agent, and the
      # agent's output, all filtered through the redaction pass in the loop.
      - name: 📤 Upload AI repair diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-repair-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kilo-repair/**
          if-no-files-found: ignore
          retention-days: 14

      - name: 🔖 Set short SHA
        id: set_sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: ✏️ Rename APKs with commit hash
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*-release.apk; do
            mv "$apk" "${apk%.apk}-${{ steps.set_sha.outputs.short_sha }}.apk"
          done
          ls -la

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-release-${{ steps.set_sha.outputs.short_sha }}
          path: app/build/outputs/apk/release/app-*-release-${{ steps.set_sha.outputs.short_sha }}.apk

  aggregateAndSend:
    name: 📣 Send APKs to Telegram
    runs-on: ${{ vars.IS_USING_HOSTED_RUNNERS == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    needs: build
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v6

      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: apk-release-${{ needs.build.outputs.short_sha }}
          path: ./downloaded-artifact

      - name: 🐍 Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 📦 Install Dependencies
        run: pip install telethon

      - name: 📝 Get Git Commit Info
        run: |
          echo "COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: 💾 Restore Telegram session cache
        uses: actions/cache@v6
        id: telegram_session_cache
        with:
          path: bot_session.session
          key: telegram-session-${{ runner.os }}-bot_session

      - name: 📨 Send APKs to Telegram
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          # arm64-v8a only: the split per ABI means an APK no longer runs on every device, and
          # arm64 covers the test fleet. All three splits stay available in the uploaded artifact.
          APK_PATH: ./downloaded-artifact/app-arm64-v8a-release-${{ needs.build.outputs.short_sha }}.apk
          GITHUB_ACTOR: ${{ github.actor }}
          # Only push and workflow_dispatch runs reach here, so head_ref is always empty and
          # ref_name is the real branch. head_ref is kept as a fallback for defensiveness.
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: python ./.github/workflows/deploy_artifacts.py
        continue-on-error: true
