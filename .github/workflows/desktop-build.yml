name: Desktop Build

on:
  push:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/desktop-build.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Install Linux packaging dependencies
      if: ${{ runner.os == 'Linux' }}
      run: sudo apt-get update && sudo apt-get install -y binutils fakeroot

    - name: Grant execute permission for gradlew
      if: runner.os != 'Windows'
      run: chmod +x gradlew

    - name: Build and Package Desktop App
      run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

    - name: Print jpackage logs on failure
      if: ${{ failure() && runner.os == 'Linux' }}
      run: |
        if [ -d desktop/build/compose/logs ]; then
          find desktop/build/compose/logs -maxdepth 4 -type f -print -exec cat {} \;
        else
          echo "No jpackage log directory was created."
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: synapse-desktop-${{ matrix.os }}
        path: |
          desktop/build/compose/binaries/main/deb/*.deb
          desktop/build/compose/binaries/main/dmg/*.dmg
          desktop/build/compose/binaries/main/msi/*.msi
          desktop/build/compose/binaries/main/exe/*.exe
          desktop/build/compose/binaries/main/app/*.app
        if-no-files-found: warn
