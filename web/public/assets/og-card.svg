<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Synapse — open-source social for Android, iOS, Windows, Linux and the CLI">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <ellipse cx="984" cy="113" rx="450" ry="230" fill="url(#glowCyan)"/>
  <ellipse cx="96" cy="517" rx="400" ry="230" fill="url(#glowViolet)"/>

  <!-- brand row -->
  <g>
    <rect x="64" y="56" width="56" height="56" rx="16" fill="url(#tile)"/>
    <g transform="translate(74 66) scale(1.75)">
      <path d="M10.5 21.5C16 21.5 16 10.5 21.5 10.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <circle cx="10.5" cy="21.5" r="3.2" fill="#FFFFFF"/>
      <circle cx="21.5" cy="10.5" r="3.2" fill="#FFFFFF"/>
    </g>
    <text x="138" y="94" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#FAFAFA">Synapse</text>
    <text x="138" y="120" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#A1A1AA">Open-source social</text>
  </g>

  <!-- headline -->
  <g font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#FAFAFA">
    <text x="64" y="312">Your people.</text>
    <text x="64" y="390" fill="#22D3EE">Every device.</text>
  </g>
  <text x="64" y="440" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="27" fill="#A1A1AA">DMs, communities and feeds with an open API, a real CLI and self-hosting built in.</text>

  <!-- platform pills -->
  <g font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="19" fill="#E4E4E7">
    <g>
      <rect x="64" y="530" width="120" height="52" rx="26" fill="none" stroke="#FAFAFA" stroke-opacity="0.16"/>
      <text x="124" y="562" text-anchor="middle">Android</text>
    </g>
    <g>
      <rect x="196" y="530" width="82" height="52" rx="26" fill="none" stroke="#FAFAFA" stroke-opacity="0.16"/>
      <text x="237" y="562" text-anchor="middle">iOS</text>
    </g>
    <g>
      <rect x="290" y="530" width="128" height="52" rx="26" fill="none" stroke="#FAFAFA" stroke-opacity="0.16"/>
      <text x="354" y="562" text-anchor="middle">Windows</text>
    </g>
    <g>
      <rect x="430" y="530" width="98" height="52" rx="26" fill="none" stroke="#FAFAFA" stroke-opacity="0.16"/>
      <text x="479" y="562" text-anchor="middle">Linux</text>
    </g>
    <g>
      <rect x="540" y="530" width="74" height="52" rx="26" fill="none" stroke="#FAFAFA" stroke-opacity="0.16"/>
      <text x="577" y="562" text-anchor="middle">CLI</text>
    </g>
  </g>

  <text x="1136" y="563" text-anchor="end" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="20" fill="#A1A1AA">MIT licensed · synapse.app</text>
</svg>
