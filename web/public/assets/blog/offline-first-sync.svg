<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A phone and a laptop exchanging messages while offline, with a merge timeline">
  <defs>
    <linearGradient id="ofs-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="ofs-glow" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.26"/>
      <stop offset="75%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="ofs-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#ofs-grid)"/>
  <rect width="1200" height="800" fill="url(#ofs-glow)"/>

  <!-- phone -->
  <g>
    <rect x="240" y="230" width="180" height="330" rx="26" fill="#131313" stroke="url(#ofs-grad)" stroke-width="2.5"/>
    <rect x="292" y="248" width="76" height="8" rx="4" fill="#27272A"/>
    <g fill="#1F1F23">
      <rect x="264" y="286" width="132" height="34" rx="10"/>
      <rect x="264" y="330" width="104" height="34" rx="10"/>
    </g>
    <rect x="300" y="378" width="96" height="34" rx="10" fill="#7C3AED" opacity="0.35"/>
    <rect x="264" y="422" width="132" height="34" rx="10" fill="#1F1F23"/>
    <rect x="264" y="500" width="86" height="12" rx="6" fill="#22D3EE" opacity="0.75"/>
  </g>

  <!-- laptop -->
  <g>
    <rect x="700" y="270" width="330" height="212" rx="14" fill="#131313" stroke="url(#ofs-grad)" stroke-width="2.5"/>
    <path d="M670 482h390l26 40H644z" fill="#161616" stroke="#3F3F46" stroke-width="2"/>
    <g fill="#1F1F23">
      <rect x="726" y="300" width="230" height="30" rx="9"/>
      <rect x="726" y="342" width="180" height="30" rx="9"/>
    </g>
    <rect x="800" y="384" width="200" height="30" rx="9" fill="#22D3EE" opacity="0.22"/>
    <rect x="726" y="428" width="150" height="12" rx="6" fill="#7C3AED" opacity="0.7"/>
  </g>

  <!-- merge timeline between devices -->
  <g stroke="url(#ofs-grad)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M452 330c58-46 118-46 176 0" stroke-dasharray="6 10"/>
    <path d="M452 430c58 46 118 46 176 0" stroke-dasharray="6 10"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="638" cy="338" r="7"/>
    <circle cx="446" cy="424" r="7" fill="#7C3AED"/>
  </g>
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="20" fill="#A1A1AA">
    <text x="636" y="316">draft</text>
    <text x="430" y="466">reply</text>
  </g>

  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" letter-spacing="6">
    <text x="100" y="672" fill="#71717A" font-size="22">WRITTEN UNDERGROUND · MERGED ON RECONNECT</text>
    <text x="100" y="112" fill="#E4E4E7" font-size="40" font-weight="600" letter-spacing="0">Offline is the default path</text>
  </g>
</svg>
