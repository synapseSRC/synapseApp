<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="A terminal window running the synapse command line tool next to a chat message it posted">
  <defs>
    <linearGradient id="crb-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="crb-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="crb-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#0A0A0A"/>
  <rect width="1200" height="800" fill="url(#crb-grid)"/>
  <rect width="1200" height="800" fill="url(#crb-glow)"/>

  <!-- terminal -->
  <g>
    <rect x="100" y="188" width="560" height="404" rx="18" fill="#101012" stroke="url(#crb-grad)" stroke-width="2.5"/>
    <path d="M100 240h560" stroke="#27272A" stroke-width="2"/>
    <circle cx="130" cy="214" r="7" fill="#3F3F46"/>
    <circle cx="152" cy="214" r="7" fill="#3F3F46"/>
    <circle cx="174" cy="214" r="7" fill="#7C3AED"/>
    <text x="600" y="220" text-anchor="end" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#71717A">synapse — zsh</text>
    <g font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="21">
      <text x="132" y="290" fill="#22D3EE">$</text>
      <text x="156" y="290" fill="#E4E4E7">synapse send --space deploys \</text>
      <text x="156" y="322" fill="#A1A1AA">"build 4102 live"</text>
      <text x="132" y="374" fill="#71717A">delivered · 1 space · 24 members</text>
      <text x="132" y="430" fill="#22D3EE">$</text>
      <text x="156" y="430" fill="#E4E4E7">synapse watch --space deploys</text>
      <text x="132" y="474" fill="#71717A">listening for message.created…</text>
      <rect x="132" y="500" width="14" height="26" fill="#22D3EE" opacity="0.85"/>
    </g>
  </g>

  <!-- resulting message -->
  <g>
    <rect x="712" y="264" width="388" height="252" rx="18" fill="#131313" stroke="#3F3F46" stroke-width="2"/>
    <path d="M712 316h388" stroke="#27272A" stroke-width="2"/>
    <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif">
      <text x="740" y="298" font-size="16" fill="#A1A1AA">#deploys</text>
      <text x="740" y="356" font-size="15" fill="#71717A">synapse-bot · via CLI</text>
      <text x="740" y="400" font-size="20" fill="#E4E4E7">build 4102 live</text>
    </g>
    <g>
      <rect x="740" y="436" width="60" height="30" rx="15" fill="#1F1F23"/>
      <text x="770" y="456" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A1A1AA">👍 9</text>
      <rect x="812" y="436" width="60" height="30" rx="15" fill="#1F1F23"/>
      <text x="842" y="456" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#A1A1AA">🚀 3</text>
    </g>
    <path d="M660 400h52" stroke="url(#crb-grad)" stroke-width="3" stroke-dasharray="6 9" stroke-linecap="round" fill="none"/>
  </g>

  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" letter-spacing="6">
    <text x="100" y="672" fill="#71717A" font-size="22">FORTY LINES · ONE WEBHOOK · NO PLUGIN HOST</text>
    <text x="100" y="112" fill="#E4E4E7" font-size="40" font-weight="600" letter-spacing="0">Automate it from the shell</text>
  </g>
</svg>
