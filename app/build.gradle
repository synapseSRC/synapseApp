plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dagger.hilt.android.plugin'
    id 'com.google.gms.google-services'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def getGitCommitHash = { ->
    return "git rev-parse --short HEAD".execute().text.trim()
}

def getGitCommitCount = { ->
    return "git rev-list --count HEAD".execute().text.trim().toInteger()
}

// CI injects SENTRY_DSN; leave it empty for local builds without Sentry configured.
def sentryDsn = (System.getenv('SENTRY_DSN') ?: project.findProperty('SENTRY_DSN') ?: '').toString()
def sentryAgentTraceSampleRate = (System.getenv('SENTRY_AGENT_TRACE_SAMPLE_RATE') ?: project.findProperty('SENTRY_AGENT_TRACE_SAMPLE_RATE') ?: '0.1').toString()
def parsedSentryAgentTraceSampleRate = sentryAgentTraceSampleRate.toDouble()
if (parsedSentryAgentTraceSampleRate < 0.0 || parsedSentryAgentTraceSampleRate > 1.0) {
    throw new GradleException('SENTRY_AGENT_TRACE_SAMPLE_RATE must be between 0.0 and 1.0')
}

android {
    namespace = "com.synapse.social.studioasinc"
    compileSdk 37
    buildToolsVersion = "36.0.0"

    signingConfigs {
        debug {
            // Use default debug keystore
        }
        release {
            storeFile file("release_key.jks")
            storePassword "1111"
            keyAlias "ashik"
            keyPassword "1111"
        }
    }

    defaultConfig {
        applicationId = "com.synapse.social.studioasinc"
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""
        buildConfigField "double", "SENTRY_AGENT_TRACE_SAMPLE_RATE", sentryAgentTraceSampleRate
        minSdk = 26
        targetSdk 35
        def gitHash = getGitCommitHash()
        // Exposed separately from versionName so the About screen can show the exact commit of the
        // build without parsing versionNameSuffix ("-debug") out of the hash.
        buildConfigField "String", "GIT_COMMIT_HASH", "\"${gitHash}\""
        versionCode = getGitCommitCount()
        versionName = "${(project.findProperty("projectVersion") ?: "0.1.0").toString().replaceFirst("^v", "")}-${gitHash}"
        vectorDrawables.useSupportLibrary = true

        compileOptions {
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            buildConfigField "String", "DEVELOPER_EMAIL", "\"mashikahamed0@gmail.com\""
            // The call-simulation switch is debug-only, but the inbox reads it from the shared
            // source set, so the release variant needs the field to compile. Always false here:
            // the mock repository is not in this variant's dex, so the flag can only ever be off.
            buildConfigField "boolean", "CALL_SIMULATION_ENABLED", "false"
            buildConfigField "String", "SUPABASE_URL", "\"${System.getenv('SUPABASE_URL') ?: project.findProperty('SUPABASE_URL') ?: ''}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${System.getenv('SUPABASE_ANON_KEY') ?: project.findProperty('SUPABASE_ANON_KEY') ?: ''}\""
            // Google OAuth Configuration (Client ID only; secrets are kept server-side)
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${System.getenv('GOOGLE_WEB_CLIENT_ID') ?: project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: ''}\""
            
            // OneSignal Configuration
            buildConfigField "String", "ONESIGNAL_APP_ID", "\"${System.getenv('ONESIGNAL_APP_ID') ?: project.findProperty('ONESIGNAL_APP_ID') ?: ''}\""
            // Shifted to Supabase Edge Functions for security.
            // buildConfigField "String", "ONESIGNAL_REST_API_KEY", "\"${System.getenv('ONESIGNAL_REST_API_KEY') ?: project.findProperty('ONESIGNAL_REST_API_KEY') ?: ''}\""
            buildConfigField "String", "APP_DOMAIN", "\"${System.getenv('APP_DOMAIN') ?: ''}\""

            // Supabase Edge Function that mints short-lived TURN credentials. This is a route
            // name, not a secret: the shared secret lives in Supabase functions secrets
            // (TURN_SHARED_SECRET) and never reaches the app.
            buildConfigField "String", "TURN_FUNCTION_NAME", "\"${System.getenv('TURN_FUNCTION_NAME') ?: project.findProperty('TURN_FUNCTION_NAME') ?: 'turn-credentials'}\""

            // Authentication configuration for production
            buildConfigField "boolean", "AUTH_REQUIRE_EMAIL_VERIFICATION", "${project.findProperty('auth.require.email.verification') ?: ''}"
            buildConfigField "boolean", "AUTH_ENABLE_DEBUG_LOGGING", "${project.findProperty('auth.enable.debug.logging') ?: ''}"
            buildConfigField "boolean", "AUTH_DEVELOPMENT_MODE", "${project.findProperty('auth.development.mode') ?: ''}"
            buildConfigField "int", "AUTH_RESEND_COOLDOWN_SECONDS", "${project.findProperty('auth.resend.cooldown.seconds') ?: ''}"
            buildConfigField "int", "AUTH_MAX_RESEND_ATTEMPTS", "${project.findProperty('auth.max.resend.attempts') ?: ''}"
            buildConfigField "int", "AUTH_AUTO_RETRY_ATTEMPTS", "${project.findProperty('auth.auto.retry.attempts') ?: ''}"
            buildConfigField "long", "AUTH_RETRY_DELAY_MS", "${project.findProperty('auth.retry.delay.ms') ?: ''}"
        }
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
            buildConfigField "String", "DEVELOPER_EMAIL", "\"mashikahamed0@gmail.com\""
            buildConfigField "String", "SUPABASE_URL", "\"${System.getenv('SUPABASE_URL') ?: project.findProperty('SUPABASE_URL') ?: ''}\""
            buildConfigField "String", "SUPABASE_ANON_KEY", "\"${System.getenv('SUPABASE_ANON_KEY') ?: project.findProperty('SUPABASE_ANON_KEY') ?: ''}\""
            buildConfigField "String", "ONESIGNAL_APP_ID", "\"${System.getenv('ONESIGNAL_APP_ID') ?: project.findProperty('ONESIGNAL_APP_ID') ?: ''}\""
            // Shifted to Supabase Edge Functions for security.
            // buildConfigField "String", "ONESIGNAL_REST_API_KEY", "\"${System.getenv('ONESIGNAL_REST_API_KEY') ?: project.findProperty('ONESIGNAL_REST_API_KEY') ?: ''}\""
            buildConfigField "String", "APP_DOMAIN", "\"${System.getenv('APP_DOMAIN') ?: ''}\""

            // Supabase Edge Function that mints short-lived TURN credentials. This is a route
            // name, not a secret: the shared secret lives in Supabase functions secrets
            // (TURN_SHARED_SECRET) and never reaches the app.
            buildConfigField "String", "TURN_FUNCTION_NAME", "\"${System.getenv('TURN_FUNCTION_NAME') ?: project.findProperty('TURN_FUNCTION_NAME') ?: 'turn-credentials'}\""

            // Opt-in switch for the debug-only simulated call repository (app/src/debug). Off by
            // default: a debug build dials for real unless this says otherwise. Flip it with
            // `call.simulation.enabled=true` in gradle.properties (or -Pcall.simulation.enabled=true)
            // and reinstall. The release build type has no such field and no mock in its dex — the
            // simulation code is not compiled into it at all.
            buildConfigField "boolean", "CALL_SIMULATION_ENABLED", "${project.findProperty('call.simulation.enabled') ?: 'false'}"
            
            // Google OAuth Configuration (Client ID only; secrets are kept server-side)
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${System.getenv('GOOGLE_WEB_CLIENT_ID') ?: project.findProperty('GOOGLE_WEB_CLIENT_ID') ?: ''}\""

            // Authentication configuration for development
            buildConfigField "boolean", "AUTH_REQUIRE_EMAIL_VERIFICATION", "${project.findProperty('auth.require.email.verification') ?: ''}"
            buildConfigField "boolean", "AUTH_ENABLE_DEBUG_LOGGING", "${project.findProperty('auth.enable.debug.logging') ?: ''}"
            buildConfigField "boolean", "AUTH_DEVELOPMENT_MODE", "${project.findProperty('auth.development.mode') ?: ''}"
            buildConfigField "int", "AUTH_RESEND_COOLDOWN_SECONDS", "${project.findProperty('auth.resend.cooldown.seconds') ?: ''}"
            buildConfigField "int", "AUTH_MAX_RESEND_ATTEMPTS", "${project.findProperty('auth.max.resend.attempts') ?: ''}"
            buildConfigField "int", "AUTH_AUTO_RETRY_ATTEMPTS", "${project.findProperty('auth.auto.retry.attempts') ?: ''}"
            buildConfigField "long", "AUTH_RETRY_DELAY_MS", "${project.findProperty('auth.retry.delay.ms') ?: ''}"
        }
    }

    // libsignal and WebRTC each carry a multi-megabyte native library per ABI, so shipping every
    // ABI in one APK made each user download three architectures they can never load. Splitting
    // puts one architecture per file. 32-bit x86 is left out: Android devices with it are extinct
    // and the emulator uses x86_64, which is kept.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-opt-in=kotlin.time.ExperimentalTime'
        ]
    }

    buildFeatures {
        viewBinding = false
        dataBinding = false
        buildConfig = true
        compose = true
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                exclude '**/PollRepositoryTest.class'
                exclude '**/SearchRepositoryTest.class'
            }
        }
    }

    packaging {
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/DEPENDENCIES")
        resources.excludes.add("**/libsignal_jni*.dylib")
        resources.excludes.add("**/signal_jni*.dll")
        // The libsignal-android AAR ships its Rust test harness next to the runtime library, one
        // copy per ABI. Only libsignal_jni.so is loaded by the protocol code, so the testing binary
        // is dead weight in every APK.
        jniLibs.excludes.add("**/libsignal_jni_testing.so")
    }
}

configurations.all {
    exclude group: 'com.google.protobuf', module: 'protobuf-java'
    resolutionStrategy {
        force 'org.jetbrains.kotlinx:kotlinx-datetime:0.7.1'
        force 'com.squareup.okhttp3:okhttp:5.3.2'
    }
}


